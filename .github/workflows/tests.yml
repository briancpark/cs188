  minicontest2:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.7
        uses: actions/setup-python@v3
        with:
          python-version: '3.7'
      - name: Install Xvfb
        run: |
            sudo apt-get update
            sudo apt-get install -y xvfb
      - name: Install coverage
        run: pip3 install coverage
      - name: Run Minicontest 2
        run: |
          cd minicontest2
          xvfb-run -a coverage run --source=. capture.py -r baselineTeam -b myTeam
          coverage report
          coverage html
          coverage xml
      - name: Upload coverage reports
