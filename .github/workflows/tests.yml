name: Local Autograder

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  tutorial-tests:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.7
        uses: actions/setup-python@v3
        with:
          python-version: '3.7'
      - name: Install coverage
        run: pip3 install coverage
      - name: Run Tutorial Tests
        run: |
          cd tutorial
          coverage run --source=. autograder.py
          coverage report
          coverage html
          coverage xml
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-coverage
          path: |
            tutorial/htmlcov/
            tutorial/coverage.xml

  project1-tests:
